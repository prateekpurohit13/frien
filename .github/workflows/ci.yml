# CI baseline for frien (Phase 0 exit criterion: build, test, lint, vuln scan, and
# a signed, SBOM'd artifact). A tool that runs privileged on a fleet must be
# supply-chain clean from the first commit (docs/security.md §Supply Chain).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install protobuf toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify generated proto is up to date
        run: |
          make proto-gen
          git diff --exit-code -- pkg/proto || \
            (echo "::error::pkg/proto is stale; run 'make proto-gen' and commit" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  supply-chain:
    name: build, sbom & sign
    runs-on: ubuntu-latest
    needs: [build-test, lint, vuln]
    # Signing needs OIDC; only run on pushes to main (not on fork PRs).
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write # keyless cosign signing via OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        run: |
          mkdir -p build
          CGO_ENABLED=0 go build -trimpath -o build/friend ./cmd/friend
          CGO_ENABLED=0 go build -trimpath -o build/frienctl ./cmd/frienctl
          CGO_ENABLED=0 go build -trimpath -o build/frien-enforcer ./cmd/frien-enforcer

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: frien.spdx.json

      - name: Scan dependencies (grype)
        uses: anchore/scan-action@v4
        with:
          path: .
          fail-build: true
          severity-cutoff: critical

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        run: |
          for bin in build/friend build/frienctl build/frien-enforcer; do
            cosign sign-blob --yes "$bin" \
              --output-signature "$bin.sig" \
              --output-certificate "$bin.pem.bundle"
          done

      - name: Upload signed artifacts + SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frien-release
          path: |
            build/
            frien.spdx.json
