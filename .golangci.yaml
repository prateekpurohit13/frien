version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    paths:
      - pkg/proto/v1/.*\.pb\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
